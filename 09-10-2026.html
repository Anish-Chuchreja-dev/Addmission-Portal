<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Welcome to Admission Portal</h1>
    <form>
        <label for="name">Enter your first name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your first name" required>
        <br><br>
        <label for="name">Enter your last name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your last name" required>
        <br><br>
        <Label for="age">Enter your age:</label>
        <input type="number" id="age" name="age" placeholder="Enter your age" required>
        <br><br>
        <label for="Course">Select your Course:</label>
        <select id="Course" name="Course" required>
            <option value="BCA">BCA</option>
            <option value="B.Tech (CSE)">B.Tech (CSE)</option>
            <option value="B.Tech (CSE-AI)">B.Tech (CSE-AI)</option>
        </select>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>
        <label for="file">File Upload:</label>
        <input type="file" id="file" name="file" required>
        <br><br>
        <label for="Color">Choose a color:</label>
        <input type="color" id="Color" name="Color" required>
        <br><br>
        <label for="Progress">Progress:</label>
        <input progress value="70" type="range" id="Progress" name="Progress" min="0" max="100" required>
        <br><br>
        <input type="submit" value="Submit" align="center">
        <input type="reset" value="Reset" align="center">
        <input type="button" value="Button" align="center">
    </form>
</body>
</html>
